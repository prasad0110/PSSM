        .alphabet-sidebar {
            width: 80px;

            border-right: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.02);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            z-index: 20;
            transition: all 0.2s ease;
            scrollbar-width: thin;
        }

        .alphabet-sidebar::-webkit-scrollbar {
            width: 3px;
        }

        .alphabet-sidebar::-webkit-scrollbar-track {
            background: #e2e8f0;
        }

        .alphabet-sidebar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .alpha-btn {
            background: transparent;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            width: 48px;
            height: 48px;
            margin: 4px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            color: #2c3e50;
            font-family: monospace;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,240,0.6);
            backdrop-filter: blur(2px);
        }

        .alpha-btn:hover {

            color: white;
            transform: scale(1.02);
            box-shadow: 0 6px 12px rgba(204,0,0,0.2);
        }

            box-shadow: 0 4px 12px rgba(204,0,0,0.35);
            border: 1px solid rgba(255,215,0,0.3);

    // ----- helper: normalize name and get first letter (A-Z, numbers, symbols -> #)
    function getFirstLetterForGroup(channelName) {
        if (!channelName || channelName.length === 0) return '#';
        // trim and get first character
        let firstChar = channelName.trim().charAt(0).toUpperCase();
        // if it's not A-Z, group as '#'
        if (/[A-Z]/.test(firstChar)) {
            return firstChar;
        }
        // check for Telugu / other scripts or digit → fallback to '#'
        return '#';
    }

    // sort channels by name (ascending order)
    function sortChannelsAscending(channelsArr) {
        return [...channelsArr].sort((a, b) => {
            const nameA = a.name.trim().toLowerCase();
            const nameB = b.name.trim().toLowerCase();
            if (nameA < nameB) return -1;
            if (nameA > nameB) return 1;
            return 0;
        });
    }

    // group sorted channels by letter
    function groupChannelsByLetter(sortedChannels) {
        const groups = new Map(); // letter -> array of channels
        for (const ch of sortedChannels) {
            const letter = getFirstLetterForGroup(ch.name);
            if (!groups.has(letter)) groups.set(letter, []);
            groups.get(letter).push(ch);
        }
        // sort letters: A-Z then '#' at the end
        const sortedLetters = Array.from(groups.keys()).sort((a,b) => {
            if (a === '#') return 1;
            if (b === '#') return -1;
            return a.localeCompare(b);
        });
        return { groups, sortedLetters };
    }

    // render full HTML content with letter sections
    function renderChannels(sortedChannels) {
        const { groups, sortedLetters } = groupChannelsByLetter(sortedChannels);
        const containerDiv = document.getElementById('dynamic-channel-container');
        if (!containerDiv) return;
        
        let html = '';
        for (const letter of sortedLetters) {
            const channelList = groups.get(letter);
            html += `<div class="letter-section" id="section-${letter}">`;
            html += `<div class="letter-heading">📺 ${letter}</div>`;
            html += `<ul class="channel-list">`;
            for (const ch of channelList) {
                const liveUrl = `https://www.youtube.com/${ch.handle}/live`;
                // escape handle for safety but it's safe
                const displayName = ch.name;
                const handleDisplay = ch.handle;
                html += `
                    <li class="channel-item">
                        <a href="${liveUrl}" target="_blank" class="channel-link" rel="noopener noreferrer">
                            <span class="channel-name">
                                ${escapeHtml(displayName)}
                                <span class="live-indicator">LIVE</span>
                            </span>
                            <span class="channel-handle">${escapeHtml(handleDisplay)}</span>
                        </a>
                    </li>
                `;
            }
            html += `</ul></div><hr />`;
        }
        if (sortedLetters.length === 0) {
            html = '<div style="padding:2rem;text-align:center">✨ No channels found</div>';
        }
        containerDiv.innerHTML = html;
        document.getElementById('totalCountSpan').innerText = sortedChannels.length;
        document.getElementById('liveCountDisplay').innerHTML = `📡 ${sortedChannels.length} Live Links`;
    }

    // simple escape to avoid injection
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // build A-Z buttons dynamically based on available letters after sort (makes it dynamic)
    function buildAlphabetNav(sortedChannels) {
        const { groups, sortedLetters } = groupChannelsByLetter(sortedChannels);
        const sidebar = document.getElementById('alphabetSidebar');
        if (!sidebar) return;
        sidebar.innerHTML = '';
        // add all existing letters from data
        for (let letter of sortedLetters) {
            const btn = document.createElement('button');
            btn.textContent = letter;
            btn.classList.add('alpha-btn');
            btn.setAttribute('data-letter', letter);
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const targetElement = document.getElementById(`section-${letter}`);
                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
                // active style update
                document.querySelectorAll('.alpha-btn').forEach(btnEl => btnEl.classList.remove('active-letter'));
                btn.classList.add('active-letter');
                setTimeout(() => {
                    // optional remove after 1.2 sec but keep visual feedback
                }, 600);
            });
            sidebar.appendChild(btn);
        }
        // additionally add a 'Top' button for convenience
        const topBtn = document.createElement('button');
        topBtn.textContent = '↑';
        topBtn.classList.add('alpha-btn');
        topBtn.style.background = '#cc000022';
        topBtn.style.fontSize = '1.4rem';
        topBtn.title = "Scroll to top";
        topBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.querySelectorAll('.alpha-btn').forEach(btn => btn.classList.remove('active-letter'));
        });
        sidebar.appendChild(topBtn);
    }

    // main execution: sort + render full UI
    function init() {
        // 1. sort channels in ascending order (based on name)
        const sorted = sortChannelsAscending(rawChannels);
        // 2. render channels in sections
        renderChannels(sorted);
        // 3. build A-Z left sidebar navigation (based on available groups)
        buildAlphabetNav(sorted);
        // 4. scroll to top button logic
        const topScrollBtn = document.getElementById('scrollTopBtn');
        if (topScrollBtn) {
            topScrollBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                document.querySelectorAll('.alpha-btn').forEach(btn => btn.classList.remove('active-letter'));
            });
        }
        // optional: active section while scrolling? just nice to have
        const sections = document.querySelectorAll('.letter-section');
        if (sections.length > 0) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        if (id && id.startsWith('section-')) {
                            const letter = id.replace('section-', '');
                            document.querySelectorAll('.alpha-btn').forEach(btn => {
                                if (btn.textContent === letter) btn.classList.add('active-letter');
                                else if (btn.textContent !== '↑') btn.classList.remove('active-letter');
                            });
                        }
                    }
                });
            }, { threshold: 0.3 });
            sections.forEach(section => observer.observe(section));
        }
    }

    init();
</script>
</body>
</html>
